# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ master, validate-issue-regressions-2071-2076-1700-1189-1332 ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Node.js v20はEOLのため対象外。ドキュメント上の最低サポートに合わせて 22.x を含めます
        node-version: [24.x, 22.x]

    steps:
      - name: Checkout submodule
        uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node-version }}
    
      # 各種ライブラリをインストール
      - name: npm install
        run: npm install
      
      # 各種ビルド
      - name: npm run build
        run: npm run build
        
      # hello
      - name: npm run hello
        run: npm run hello
      
      # run test
      - name: npm run test
        run: npm run test

      # #2071のブラウザイベント回帰テストはNode.jsの最新対象で実行
      - name: Install browser smoke dependencies
        if: matrix.node-version == '24.x'
        working-directory: test-browser
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: npm run test:browser:smoke
        if: matrix.node-version == '24.x'
        working-directory: test-browser
        run: npm run test:browser:smoke
